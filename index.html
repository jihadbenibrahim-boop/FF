<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>مغامرة الكون الثلاثية</title>
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js" } }
  </script>
</head>
<body>
  <div id="hud">
    <div><strong>النقاط</strong> <span id="score">0</span></div>
    <div id="status">اجمع الكرات الذهبية!</div>
  </div>

  <div id="start-screen">
    <div class="panel">
      <h1>مغامرة الكون الثلاثية</h1>
      <p>استخدم <kbd>WASD</kbd> أو الأسهم للحركة<br />استخدم الفأرة لتدوير الكاميرا</p>
      <button id="start-button">ابدأ اللعب</button>
    </div>
  </div>

  <div id="game-over" class="hidden">
    <div class="panel">
      <h2 id="game-over-title">انتهت اللعبة!</h2>
      <p id="final-score"></p>
      <button id="restart-button">العب مرة أخرى</button>
    </div>
  </div>

  <script type="module" src="game.js"></script>
</body>
</html>
