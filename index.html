<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#07111f" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>أسرار الوادي المنسي</title>
  <link rel="stylesheet" href="style.css" />
  <script type="importmap">
    {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js"}}
  </script>
</head>
<body>
  <div id="hud">
    <div>الشظايا <strong id="score">0 / 8</strong></div>
    <div>الوقت <strong id="timer">90</strong></div>
    <div>القلوب <strong id="lives">♥ ♥ ♥</strong></div>
  </div>
  <div id="status">ابحث عن الشظايا...</div>

  <div id="mobile-controls" aria-label="أزرار الحركة">
    <button class="control" data-key="arrowup" aria-label="للأعلى">▲</button>
    <button class="control" data-key="arrowleft" aria-label="يسار">◀</button>
    <button class="control" data-key="arrowdown" aria-label="للأسفل">▼</button>
    <button class="control" data-key="arrowright" aria-label="يمين">▶</button>
  </div>

  <div id="start-screen" class="overlay">
    <div class="panel">
      <p class="eyebrow">مغامرة ثلاثية الأبعاد للهاتف والحاسوب</p>
      <h1>أسرار الوادي المنسي</h1>
      <p>اجمع الشظايا الثماني وتجنب الحارس والصخور قبل نفاد الوقت.</p>
      <p class="desktop-help"><kbd>WASD</kbd> للحركة • اسحب الفأرة للدوران</p>
      <p class="mobile-help">استخدم الأسهم أسفل الشاشة للحركة واسحب الصورة لتدوير الكاميرا.</p>
      <button id="start-button">ابدأ المغامرة</button>
    </div>
  </div>

  <div id="game-over" class="overlay hidden">
    <div class="panel">
      <h2 id="game-over-title">انتهت المغامرة</h2>
      <p id="final-score"></p>
      <button id="restart-button">العب مرة أخرى</button>
    </div>
  </div>
  <script type="module" src="game.js"></script>
</body>
</html>
